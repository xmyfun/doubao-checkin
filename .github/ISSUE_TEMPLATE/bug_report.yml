name: 报告问题
description: 签到没成功、客户端被弄坏、或者输出不对
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        先跑一次 `./scripts/doubao-checkin.sh --doctor` 再填这张表——它的输出能省掉一半来回。

        如果是「找不到签到卡片」，请把 `--dry-run` 的输出也贴上——里面有页面 URL、readyState 和正文长度，够区分是"页面没加载出来"还是"页面改了版"。

  - type: input
    id: client-version
    attributes:
      label: 豆包客户端版本
      description: `--doctor` 第一行「客户端」后面那串数字，例如 2.34.6
      placeholder: 2.34.6
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS 版本
      description: 左上角苹果菜单 → 关于本机
      placeholder: "15.8"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 现象 + 你期望的结果。如果是客户端被弄坏，说明是"点什么都没反应"还是"白屏"还是"退不掉"
      placeholder: |
        例如：定时任务跑了，但 history 里是 UNKNOWN。手动跑 --dry-run 也读不到卡片，
        页面正文 0 字，但我自己用浏览器打开活动页是正常的。
    validations:
      required: true

  - type: textarea
    id: doctor-output
    attributes:
      label: --doctor 输出
      description: 整段贴上来，别删行
      render: shell
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: logs/checkin.log 最后一段
      description: 几十行就够。注意里面有会话标题和页面文字，贴之前扫一眼有没有不想公开的内容
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我读过 README 的「已知限制」，并确认这不是已知的取舍（比如"合盖期间不跑"）
          required: true
        - label: 我贴的日志里没有账号密码、Cookie 或不希望公开的会话内容
          required: true
