# 公开仓库的 CI：每次 push / PR 都跑一遍测试。
#
# 只用 macOS runner：测试里要起真实 socket、调 lsof / ps，项目本身也只支持 macOS。
# 两个 Node 版本是因为 package.json 声明了 >=22，而用户装的很可能是更新的版本。

name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # shell 脚本是运行时的入口，语法错了 node 测试一条都拦不住
      - name: shell 语法
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" || exit 1
          done

      - name: 单元测试
        run: npm test
